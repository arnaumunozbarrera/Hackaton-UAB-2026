<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sentinel | Alert Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .grid > .panel { height: calc(100vh - 190px); min-height: 0; }
      .grid > .panel.full { height: calc(100vh - 48px); }
      .grid > .panel > .panel-body { min-height: 0; overflow-y: auto; }
      .queue-footer { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); color: var(--muted); font-size: 10px; background: #fff; }
      .queue-pagination { display: flex; align-items: center; gap: 4px; }
      .queue-pagination button { border: 1px solid var(--line); background: #fff; color: var(--muted); padding: 5px 7px; font-size: 10px; }
      .queue-pagination button.current { background: var(--deep); color: #fff; border-color: var(--deep); }
      .queue-pagination button:disabled { opacity: .45; cursor: default; }
      .expand-icon{width:18px;height:18px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:square}.expand[hidden]{display:none}.full-close{width:36px;height:36px;font-size:22px;line-height:1;flex:0 0 36px}
      .grid>.panel.full{position:fixed;inset:0;z-index:50;width:100vw;height:100vh;max-height:none;min-height:0;padding:0;margin:0;overflow:hidden;background:var(--bg)}.grid>.panel.full>.panel-head{flex:0 0 auto;padding:22px 30px 18px;background:#fff}.grid>.panel.full>.panel-body{padding:22px 30px;max-width:none;width:100%}.grid>.panel.full .ticket{max-width:1180px;margin-left:auto;margin-right:auto}
      .grid>.panel.full:has(.ticket)>.panel-head,.grid>.panel.full:has(.kpis)>.panel-head,.grid>.panel.full:has(.process-card)>.panel-head{padding:24px 38px 20px}.grid>.panel.full:has(.ticket)>.panel-body,.grid>.panel.full:has(.kpis)>.panel-body,.grid>.panel.full:has(.process-card)>.panel-body{padding:26px 38px 34px}
      .grid>.panel.full:has(.ticket) .ticket{max-width:1400px;margin:0 auto 12px;padding:16px 18px}.grid>.panel.full:has(.ticket) .ticket-meta{gap:24px}.grid>.panel.full:has(.ticket) .question{max-width:980px}.grid>.panel.full:has(.ticket) .queue-footer{padding:14px 38px}
      .grid>.panel.full:has(.kpis)>.panel-body{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));align-content:start;gap:16px}.grid>.panel.full:has(.kpis) .kpis{grid-column:1/-1;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.grid>.panel.full:has(.kpis) .chart-card{margin:0;min-height:220px}.grid>.panel.full:has(.kpis) .chart-card:nth-of-type(2){grid-column:span 7}.grid>.panel.full:has(.kpis) .chart-card:nth-of-type(3){grid-column:span 5}.grid>.panel.full:has(.kpis) .chart-card:nth-of-type(4){grid-column:1/-1}.grid>.panel.full:has(.kpis) .line-chart{height:145px}
      .grid>.panel.full:has(.process-card)>.panel-body{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));align-content:start;gap:18px}.grid>.panel.full:has(.process-card) .process-card{margin:0}.grid>.panel.full:has(.process-card) .process-card:nth-child(1){grid-column:span 7}.grid>.panel.full:has(.process-card) .process-card:nth-child(2){grid-column:span 5}.grid>.panel.full:has(.process-card) .process-card:nth-child(3){grid-column:1/-1}.grid>.panel.full:has(.process-card) .log{grid-template-columns:70px 1fr;padding:12px 0}
      @media (max-width: 900px){.grid>.panel.full:has(.kpis) .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid>.panel.full:has(.kpis) .chart-card:nth-of-type(2),.grid>.panel.full:has(.kpis) .chart-card:nth-of-type(3){grid-column:1/-1}.grid>.panel.full:has(.process-card) .process-card:nth-child(1),.grid>.panel.full:has(.process-card) .process-card:nth-child(2){grid-column:1/-1}}
      .assistant-page{padding:28px 30px;max-width:1180px;margin:0 auto}.assistant-hero{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:15px}.assistant-mark,.welcome-icon{width:34px;height:34px;display:grid;place-items:center;background:#edf7fa;color:var(--blue);font-size:17px;font-weight:700}.assistant-hero h2{margin:4px 0;font-size:19px}.assistant-hero p{margin:0;color:var(--muted);font-size:11px}.assistant-kicker{font:10px 'IBM Plex Mono',monospace;color:var(--blue);letter-spacing:.7px}.assistant-ready{margin-left:auto;white-space:nowrap;color:var(--muted);font-size:11px}.assistant-shell{background:#fff;border:1px solid var(--line);box-shadow:var(--shadow);height:calc(100vh - 225px);min-height:500px;display:flex;flex-direction:column}.assistant-messages{flex:1;min-height:0;overflow:auto;padding:26px;display:flex;flex-direction:column;gap:15px}.assistant-welcome{text-align:center;margin:auto;max-width:650px}.assistant-welcome .welcome-icon{margin:0 auto 12px}.assistant-welcome h3{margin:0 0 6px;font-size:16px}.assistant-welcome p{margin:0 0 18px;color:var(--muted);font-size:12px}.welcome-prompts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.welcome-prompts button{background:#fafbfa;border:1px solid var(--line);padding:11px;text-align:left;color:var(--ink);font-size:11px}.welcome-prompts button:hover{border-color:#b5cf9e;background:#f7faf5}.chat-message{display:flex;gap:10px;max-width:820px;align-items:flex-start}.chat-message.user{align-self:flex-end;flex-direction:row-reverse}.chat-avatar{width:28px;height:28px;flex:0 0 28px;border-radius:50%;display:grid;place-items:center;background:#dbe9c7;color:var(--deep);font-size:10px;font-weight:700}.chat-avatar.ai{background:#edf7fa;color:var(--blue)}.chat-bubble{border:1px solid var(--line);background:#fafbfa;padding:12px 14px;line-height:1.5;font-size:12px;max-width:760px}.chat-message.user .chat-bubble{background:#f5faef;border-color:#d5e4ca}.chat-bubble p{margin:0 0 10px}.assistant-results{display:grid;gap:7px;min-width:min(620px,70vw)}.assistant-result{width:100%;border:1px solid var(--line);background:#fff;padding:9px 10px;display:flex;justify-content:space-between;align-items:center;text-align:left;color:var(--ink)}.assistant-result:hover{border-color:#b5cf9e;background:#f7faf5}.assistant-result>span{display:grid;gap:3px}.assistant-result strong{font-size:11px}.assistant-result small,.assistant-source{font-size:10px;color:var(--muted)}.assistant-result>span:last-child{text-align:right;justify-items:end}.assistant-source{display:block;margin-top:10px}.assistant-composer{display:flex;gap:8px;border-top:1px solid var(--line);padding:14px 18px;background:#fafbfa}.assistant-composer input{flex:1;border:1px solid var(--line);padding:10px 12px;min-width:0}.assistant-composer button{border:1px solid var(--deep);background:var(--deep);color:#fff;padding:0 16px;font-weight:600}.loading{color:var(--muted)}.loading span{display:inline-block;width:5px;height:5px;background:var(--green);border-radius:50%;margin-right:4px;animation:assistant-pulse 1s infinite}@keyframes assistant-pulse{50%{opacity:.25}}
      @media (max-width: 720px) { .grid > .panel:not(.full) { height: 520px; min-height: 520px; } .grid > .panel.full { height: 100vh; width: 100vw; } .queue-footer { align-items: flex-start; flex-direction: column; } .assistant-page{padding:18px 13px}.assistant-hero{align-items:flex-start}.assistant-ready{margin-left:auto}.assistant-shell{height:calc(100vh - 180px);min-height:420px}.assistant-messages{padding:16px}.welcome-prompts{grid-template-columns:1fr}.assistant-results{min-width:0}.assistant-composer{padding:12px}.assistant-composer button{padding:0 12px} }
    </style>
    <link rel="stylesheet" href="fullscreen.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="app.js"></script>
    <script src="fullscreen.js"></script>
  </body>
</html>
